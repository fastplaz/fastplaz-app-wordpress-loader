<a class="skip-link" href="#content">Langsung ke konten</a>
<header id="masthead" class="site-header" role="banner">
  <div class="container header-inner">
    <!-- logo & slogan come from WordPress: Settings > General (Tagline) and
         Appearance > Customize > Site Identity (Logo). Both are optional. -->
    <a class="site-brand" href="[$baseurl]" rel="home">
      [text mod=wpnews func=sitelogo class=site-logo]
      <span class="site-brand-text">
        <span class="site-title">[text mod=wpnews func=getoption name=blogname]</span>
        <span class="site-tagline">[text mod=wpnews func=getoption name=blogdescription]</span>
      </span>
    </a>

    <button type="button" class="menu-toggle" aria-controls="site-navigation" aria-expanded="false" aria-label="Menu">
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
      <span class="menu-toggle-bar"></span>
    </button>

    <div id="site-navigation" class="site-navigation">
      [text mod=wpnews func=pagesmenu type=nav id=primary-menu class=primary-menu]

      <form role="search" method="get" class="search-form" action="[$baseurl]">
        <label class="screen-reader-text" for="search-field">Cari:</label>
        <input type="search" id="search-field" class="search-field" placeholder="Cari&hellip;" value="" name="s" />
        <button type="submit" class="search-submit" aria-label="Cari">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
      </form>
    </div>
  </div>
</header>
