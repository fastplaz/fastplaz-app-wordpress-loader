<footer id="colophon" class="ww-footer" role="contentinfo">
  <div class="ww-wrap ww-footer-inner">
    <div class="ww-footer-brand">
      <a class="ww-footer-title" href="[$baseurl]">[text mod=wpnews func=getoption name=blogname]</a>
      <p class="ww-footer-tagline">[text mod=wpnews func=getoption name=blogdescription]</p>
    </div>
    <nav class="ww-footer-nav" aria-label="Menu bawah">
      <ul>
        <li><a href="[$baseurl]">Beranda</a></li>
        <li><a href="[$baseurl]news/">Berita</a></li>
        [text mod=wpnews func=pagesmenu type=items]
      </ul>
    </nav>
  </div>
  <div class="ww-wrap ww-footer-bottom">
    <span>&copy; [text mod=wpnews func=today format=year] [text mod=wpnews func=getoption name=blogname]</span>
    <span>Didukung <a href="http://www.fastplaz.com/" target="_blank" rel="noopener">FastPlaz</a></span>
  </div>
</footer>
